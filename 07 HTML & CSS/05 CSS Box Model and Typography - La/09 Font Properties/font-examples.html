<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Properties</title>
    <link rel="stylesheet" href="font-examples.css">
</head>
<body>
    <div class="box-stile">
        <p class="font-family">Font Family: 'Arial, sans-serif'</p>
    </div>

    <div class="box-stile">
        <p class="font-size">Font Size: 24px</p>
    </div>

    <div class="box-stile">
        <p class="font-weight">Font Weight: Bold</p>
    </div>

    <div class="box-stile">
        <p class="font-style">Font Style: Italic</p>
    </div>

    <div class="box-stile">
        <p class="font-variant">Font Variant: Small-Caps</p>
    </div>
</body>
</html>
