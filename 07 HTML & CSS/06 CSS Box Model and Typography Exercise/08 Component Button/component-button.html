<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component Button</title>
    <link rel="stylesheet" href="component-button.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <section class="box">
        <h2>Link as a button</h2>
        <a href="#" class="button silver">Click Me!</a>
        <a href="#" class="button orange">Click Me!</a>
        <a href="#" class="button yellow">Click Me!</a>
        <a href="#" class="button">Click Me!</a>
        <a href="#" class="button silver"><i class="fa-solid fa-pen-to-square"></i>Edit</a>
    </section>

    <section class="box">
        <h2>Button element with class button</h2>
        <button class="button silver">Click Me!</button>
        <button  class="button orange">Click Me!</button>
        <button  class="button yellow">Click Me!</button>
        <button  class="button">Click Me!</button>
        <button  class="button silver"><i class="fa-solid fa-pen-to-square"></i>Edit</button>
    </section>
</body>
</html>
