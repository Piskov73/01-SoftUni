<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard</title>
        <link rel="stylesheet" href="../99 Utilities/reset.css">
    <link rel="stylesheet" href="keyboard.css">

</head>
<body>
    <div class="keyboard">
        <div class="row first">
            <p class="special" >esc</p>
            <p class="special">f1</p>
            <p class="special">f2</p>
            <p class="special">f3</p>
            <p class="special">f4</p>
            <p class="special">f5</p>
            <p class="special">f6</p>
            <p class="special">f7</p>
            <p class="special">f8</p>
            <p class="special">f9</p>
            <p class="special">f10</p>
            <p class="special">f11</p>
            <p class="special">f12</p>
            <p class="special">f13</p>
        </div>

        <div class="row second">
            <div class="group">
                <p>§</p>
                <p>1</p>
                <p>2</p>
                <p>3</p>
                <p>4</p>
                <p>5</p>
                <p>6</p>
                <p>7</p>
                <p>8</p>
                <p>9</p>
                <p>0</p>
                <p>-</p>
                <p>+</p>
            </div>
            <p  class="backspace special">backspace</p>
        </div>

        <div class="row three">
            <p class="tab special">tab</p>
            <div class="group">
                <p>q</p>
                <p>w</p>
                <p>e</p>
                <p>r</p>
                <p>t</p>
                <p>y</p>
                <p>u</p>
                <p>i</p>
                <p>o</p>
                <p>p</p>
                <p>[</p>
                <p>]</p>
            </div>
            <p class="enter special">Enter</p>
        </div>

        <div class="row four">
            <p class="caps-lock special">caps lock</p>
            <div class="group">
                <p>a</p>
                <p>s</p>
                <p>d</p>
                <p>f</p>
                <p>g</p>
                <p>h</p>
                <p>j</p>
                <p>k</p>
                <p>l</p>
                <p>;</p>
                <P>'</P>
                <p>\</p>
            </div>

            <div class="empty">
                
            </div>
        </div>

        <div class="row five">   
            <p class="left-shift special">shift</p>
            <div class="group">
                <p>\</p>
                <p>z</p>
                <p>x</p>
                <p>c</p>
                <p>v</p>
                <p>b</p>
                <p>n</p>
                <p>m</p>
                <p>,</p>
                <p>.</p>
                <p>/</p>
            </div>
            <p class="left-shift special">shift</p>
        </div>
       
        <div class="row sixth">
            <p class="special">ctrl</p>
            <p class="special">win</p>
            <p class="special">alt</p>
            <p class="space"></p>
            <p class="special">alt</p>
            <p class="special">win</p>
            <p class="special">ctrl</p>
        </div>
    </div>
</body>
</html>
