<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout_Section_And_Wrapper</title>
    <link rel="stylesheet" href="layout-section-and-wrapper.css">
</head>
<body>
    <div class="wrapper_model">

        <section class="section_model">
           
            <header class="box_model">
              <h1>Header</h1>

            </header>

        </section>

        <section class="section_model">
            <div class="box_model">
                <p>Banner</p>
            </div>

        </section>

        <section class="section_model">
           
            <article class="box_model">
                <p>Articles</p>

            </article>

        </section>

        <section class="section_model">

            <footer class="box_model">
                <p>Footer</p>

            </footer>

        </section>

    </div>
</body>
</html>
